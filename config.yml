#promtail config file

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml

clients:
  - url: http://LOCALHOST_IP_FROM_TAILSCALE:3100/loki/api/v1/push

scrape_configs:
  - job_name: authlog
    static_configs:
      - targets:
          - localhost
        labels:
          job: authlog
          host: ubuntu-server
          __path__: /var/log/auth.log
